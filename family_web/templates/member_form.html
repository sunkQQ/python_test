<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '编辑成员' if action == 'edit' else '添加成员' }} - 族谱记录系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
        <div class="container-fluid">
            <a class="navbar-brand fs-4" href="{{ url_for('index') }}">🌳 族谱记录系统</a>
            <div class="ms-auto d-flex gap-2">
                <a href="{{ url_for('index') }}" class="btn btn-light">← 返回首页</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-gradient-primary text-white p-4">
                        <h3 class="mb-0">{{ '✏️ 编辑成员' if action == 'edit' else '➕ 添加成员' }}</h3>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="post" id="memberForm">
                            <!-- 基本信息 -->
                            <h5 class="text-primary mb-3 pb-2 border-bottom">📝 基本信息</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label class="form-label fw-bold">姓名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="name" required
                                           value="{{ member.name if member else '' }}" placeholder="请输入姓名">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">性别</label>
                                    <select class="form-select" name="gender">
                                        <option value="男" {{ 'selected' if member and member.gender == '男' else '' }}>♂ 男</option>
                                        <option value="女" {{ 'selected' if member and member.gender == '女' else '' }}>♀ 女</option>
                                        <option value="未知" {{ 'selected' if (not member) or member.gender == '未知' else '' }}>未知</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">出生日期</label>
                                    <input type="date" class="form-control" name="birth_date"
                                           value="{{ member.birth_date if member else '' }}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">去世日期 <small class="text-muted">(健在请留空)</small></label>
                                    <input type="date" class="form-control" name="death_date"
                                           value="{{ member.death_date if member else '' }}">
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="is_alive"
                                               {{ 'checked' if (not member) or member.is_alive else '' }}>
                                        <label class="form-check-label fw-bold">✓ 健在</label>
                                    </div>
                                </div>
                            </div>

                            <!-- 家庭关系 -->
                            <h5 class="text-primary mb-3 pb-2 border-bottom">👨‍👩‍👧‍👦 家庭关系</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">父亲 <small class="text-muted">(仅显示男性)</small></label>
                                    <select class="form-select" name="father_id">
                                        <option value="">— 请选择 —</option>
                                        {% for m in members %}
                                            {% if m.gender == '男' and (member is none or m.id != member.id) %}
                                                <option value="{{ m.id }}"
                                                    {{ 'selected' if member and member.father_id == m.id else '' }}>
                                                    {{ m.name }} ({{ m.birth_date or '未知出生' }})
                                                </option>
                                            {% endif %}
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">母亲 <small class="text-muted">(仅显示女性)</small></label>
                                    <select class="form-select" name="mother_id">
                                        <option value="">— 请选择 —</option>
                                        {% for m in members %}
                                            {% if m.gender == '女' and (member is none or m.id != member.id) %}
                                                <option value="{{ m.id }}"
                                                    {{ 'selected' if member and member.mother_id == m.id else '' }}>
                                                    {{ m.name }} ({{ m.birth_date or '未知出生' }})
                                                </option>
                                            {% endif %}
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">配偶</label>
                                    <select class="form-select" name="spouse_id">
                                        <option value="">— 请选择 —</option>
                                        {% for m in members %}
                                            {% if member is none or m.id != member.id %}
                                                <option value="{{ m.id }}"
                                                    {{ 'selected' if member and member.spouse_id == m.id else '' }}>
                                                    {{ m.name }} ({{ m.gender }})
                                                </option>
                                            {% endif %}
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <!-- 其他信息 -->
                            <h5 class="text-primary mb-3 pb-2 border-bottom">📄 其他信息</h5>
                            <div class="mb-4">
                                <label class="form-label fw-bold">备注（生平、职业、籍贯等）</label>
                                <textarea class="form-control" name="note" rows="4"
                                          placeholder="可记录职业、籍贯、重要事件等">{{ member.note if member else '' }}</textarea>
                            </div>

                            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-primary btn-lg flex-fill">
                                    {{ '💾 保存修改' if action == 'edit' else '➕ 添加成员' }}
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary btn-lg">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 健在状态切换
        document.addEventListener('DOMContentLoaded', function() {
            const isAlive = document.querySelector('input[name="is_alive"]');
            const deathInput = document.querySelector('input[name="death_date"]');
            if (isAlive && deathInput) {
                function toggle() {
                    deathInput.disabled = isAlive.checked;
                    if (isAlive.checked) deathInput.value = '';
                }
                isAlive.addEventListener('change', toggle);
                toggle();
            }
        });
    </script>
</body>
</html>
